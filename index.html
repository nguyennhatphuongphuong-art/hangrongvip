 nghỉ?” — “Đừng hỏi câu khó.”"], "money": ["“Tháng này còn tiền không?” — “Còn.” — “Bao nhiêu?” — “Đủ để không hỏi nữa.”", "“Giá gì cũng tăng.” — “Lương có tăng không?” — “Câu hỏi hay.”", "“Tiền không mua được hạnh phúc.” — “Nhưng hết tiền thì buồn thật.”", "“Mua cái này đi.” — “Không có tiền.” — “Thẻ tín dụng?” — “Cũng không.”", "“Tiền nhà tháng này bao nhiêu?” — “Đừng nhắc.”", "“Tao vừa lãnh lương.” — “Chúc mừng.” — “Còn bao nhiêu?” — “Không còn.”", "“Có tiền đi cafe không?” — “Có.” — “Thật à?” — “Có tiền trong ký ức.”", "“Mày tiết kiệm kiểu gì?” — “Không mua gì.” — “Thế sao vẫn hết?” — “Tiền có chân.”", "“Tháng này ăn sang nhé.” — “Phở.” — “Sang hơn.” — “Thêm quẩy.”", "“Mua xe chưa?” — “Đang mua thời gian bằng cách đi bộ.”"], "social": ["“Trên mạng ai cũng thành công.” — “Ừ, ngoài đời thì tắc đường.”", "“Thấy người ta check-in chưa?” — “Thấy.” — “Mình đi chưa?” — “Mình còn đang trả tiền nhà.”", "“Ai cũng bảo phải cố gắng.” — “Tôi đang cố ngủ đủ trước.”", "“Bài đăng hôm qua 5 nghìn like.” — “Ngoài đời có ai hỏi thăm không?”", "“Người ta 22 tuổi mua nhà.” — “Tôi 22 tuổi mua mì.”", "“Cậu xem reels chưa?” — “Đang xem.” — “Bao lâu rồi?” — “Không biết.”", "“Ai cũng có cuộc sống đẹp trên mạng.” — “Có cả filter nữa mà.”", "“Mạng xã hội làm mình biết nhiều người.” — “Và quên mất người bên cạnh.”", "“Bài này bảo dậy 5 giờ sáng.” — “Tôi dậy 5 giờ để uống nước rồi ngủ.”", "“Hôm nay không đăng gì à?” — “Hôm nay sống.”"], "life": ["“Bao giờ ổn định?” — “Khi nào biết được thì tôi báo.”", "“Dạo này vui không?” — “Có hôm vui, có hôm có việc.”", "“Lớn rồi thấy thời gian nhanh thật.” — “Tiền cũng vậy.”", "“Có kế hoạch tương lai chưa?” — “Có.” — “Gì?” — “Để mai tính.”", "“Mẹ hỏi bao giờ lấy bằng.” — “Con còn chưa lấy được tiền.”", "“Bạn bè giờ mỗi đứa một nơi.” — “Ừ, group chat vẫn còn.”", "“Cuối tuần làm gì?” — “Nghỉ.” — “Nghỉ thật à?” — “Trong kế hoạch.”", "“Hôm nay mệt không?” — “Cũng bình thường.” — “Mai vẫn đi làm?” — “Ừ.”", "“Có khi nào muốn bỏ hết không?” — “Có.” — “Rồi sao?” — “Sáng mai vẫn dậy.”", "“Mày thấy mình lớn chưa?” — “Thấy hóa đơn rồi.”"], "ambient": ["“Sáng nay đường đông thật.”", "“Trời hôm nay đẹp.”", "“Cà phê bên kia mới mở đấy.”", "“Hình như sắp mưa.”", "“Xe bus hôm nay đông ghê.”", "“Đi cẩn thận nhé.”", "“Ủa, lâu rồi không gặp.”", "“Hôm nay ai cũng vội.”", "“Chiều nay chắc đông khách.”", "“Mùi phở thơm ghê.”", "“Đèn đỏ lâu thật.”", "“Có ai biết trạm xe buýt ở đâu không?”", "“Hôm nay nóng ghê.”", "“Quán kia đang giảm giá.”", "“Tối nay chắc mưa.”", "“Đường này buổi tối đông lắm.”", "“Sáng sớm đã kẹt xe rồi.”", "“Hình như có người chuyển trọ.”"], "shipper": ["“Anh ơi khách bảo xuống lấy hàng.” — “Xuống chưa?” — “Chưa.” — “Sao?” — “Khách bảo đợi.”", "“Địa chỉ ghi tầng 12.” — “Có thang máy không?” — “Có.” — “May quá.”", "“Mưa thế này vẫn chạy à?” — “Tiền thuê nhà không đợi nắng.”", "“Đơn này xa không?” — “Xa.” — “Tiền?” — “Không xa lắm.”", "“Khách ghi số nhà thiếu.” — “Gọi chưa?” — “Đang gọi.” — “Nghe máy không?” — “Đang hy vọng.”", "“Đơn này có cần gấp không?” — “Khách nói gấp.” — “Khách đâu?” — “Chưa thấy.”", "“Hôm nay chạy bao nhiêu đơn?” — “Đủ để nhớ đường.”", "“Pin còn bao nhiêu?” — “Hai mươi phần trăm.” — “Thế là căng.”"]};
function el(tag,c,id){const e=document.createElement(tag);e.className=c||'';if(id)e.id=id;return e}function img(n,c,id){const e=el('img',c,id);e.src=A[n]||'';e.draggable=false;return e}
function build(){app.innerHTML=`<div class="hud"><div class="title">ĐỜI NÀY CÓ GÌ VUI?</div><div class="sub">MODULE 03 · ĐƯỜNG PHỐ · WORLD + NPC + DIALOGUE</div><div class="stats"><div class="stat"><b>575.000đ</b><span>Tiền</span></div><div class="stat"><b>88</b><span>❤</span></div><div class="stat"><b>95</b><span>⚡</span></div></div></div><div class="viewport" id="vp"><div class="world" id="world"><div class="farStrip"><img src="${A['street_far.png']}" class="farPiece" style="left:0px;transform:scaleX(1)"><img src="${A['street_far.png']}" class="farPiece" style="left:300px;transform:scaleX(-1)"><img src="${A['street_far.png']}" class="farPiece" style="left:600px;transform:scaleX(1)"><img src="${A['street_far.png']}" class="farPiece" style="left:900px;transform:scaleX(-1)"><img src="${A['street_far.png']}" class="farPiece" style="left:1200px;transform:scaleX(1)"><img src="${A['street_far.png']}" class="farPiece" style="left:1500px;transform:scaleX(-1)"><img src="${A['street_far.png']}" class="farPiece" style="left:1800px;transform:scaleX(1)"><img src="${A['street_far.png']}" class="farPiece" style="left:2100px;transform:scaleX(-1)"></div><div class="sidewalkTop"></div><div class="road"><div class="roadMark m1"></div><div class="roadMark m2"></div></div><div class="sidewalkBottom"></div><div class="crosswalk" style="left:610px"></div><div class="crosswalk" style="left:1530px"></div><div id="decor"></div><div id="hotspots"></div><div id="ents"></div><div class="dialogLayer" id="dl"></div></div></div><div class="ui"><div class="row"><b id="activity">ĐI DẠO</b><span id="place">Nhà trọ</span></div><div class="buttons"><button data-a="walk">ĐI DẠO</button><button data-a="cafe">ĐI CAFE</button><button data-a="market">ĐI CHỢ</button><button data-a="stop">DỪNG LẠI</button></div><div class="meter"><i id="meter"></i></div></div><div class="bottom"><button data-a="home">VỀ PHÒNG</button><button data-a="continue">ĐI TIẾP</button><button data-a="map">BẢN ĐỒ</button></div>`;
const decor=document.getElementById('decor');for(let x=180;x<W;x+=310){const t=el('div','tree');t.style.left=x+'px';decor.appendChild(t);const l=el('div','lamp');l.style.left=(x+85)+'px';decor.appendChild(l)}
const hs=document.getElementById('hotspots');POI.forEach(([name,x])=>{const b=el('button','hotspot');b.style.left=(x-95)+'px';b.title=name;b.onclick=()=>goTo(x);hs.appendChild(b);const lab=el('div','poiLabel');lab.textContent=name;lab.id='poi-'+x;lab.style.left=x+'px';hs.appendChild(lab)});
const ents=document.getElementById('ents');ents.appendChild(img('char_player_male.png','entity player','player'));N.forEach(n=>{ents.appendChild(img(n.asset,'entity npc','n-'+n.id));const tag=el('div','name','tag-'+n.id);tag.textContent=n.name;ents.appendChild(tag)});
for(const b of document.querySelectorAll('[data-a]'))b.onclick=()=>act(b.dataset.a);}
function goTo(x){S.target=Math.max(90,Math.min(W-90,x));S.mode='walk';toast('Đang đi tới điểm đến...')}
function act(a){if(a==='home'){toast('Về phòng sẽ được nối ở bản tổng.');return}if(a==='stop'){S.mode='idle';S.target=S.x;return}if(a==='continue'){goTo(S.x+520);return}if(a==='map'){toast('Nhà trọ → Cafe → Phở → Tạp hóa → Hiệu thuốc → Điện thoại → Trạm xe → Chợ');return}if(a==='cafe'){goTo(470);document.getElementById('activity').textContent='ĐI CAFE'}if(a==='market'){goTo(2210);document.getElementById('activity').textContent='ĐI CHỢ'}if(a==='walk'){goTo(W-90);document.getElementById('activity').textContent='ĐI DẠO'}}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const e=el('div','toast');e.textContent=t;app.appendChild(e);setTimeout(()=>e.remove(),1600)}
function line(n){let keys=['ambient','student','work','money','social','life'];if(n.id==='shipper')keys.push('shipper');let cand=[];for(const k of keys)for(let i=0;i<POOL[k].length;i++){const id=k+':'+i;if(!S.recent.includes(id))cand.push({id,t:POOL[k][i]})}if(!cand.length){S.recent=[];return line(n)}const c=cand[Math.floor(Math.random()*cand.length)];S.recent.push(c.id);if(S.recent.length>35)S.recent.shift();return c.t}
function pairDialogue(a,b){const pairs=['“Ê, đi đâu đấy?” — “Đi làm.” — “Giờ này?” — “Đừng hỏi.”','“Mày còn tiền không?” — “Câu hỏi nhạy cảm.”','“Tối nay ăn gì?” — “Có gì ăn nấy.”','“Mai đi học không?” — “Nếu tỉnh.”','“Cuối tuần rảnh không?” — “Rảnh trên lịch thôi.”','“Mày thấy cuộc đời sao?” — “Đang loading.”','“Hôm nay mệt không?” — “Cũng bình thường.”'];return pairs[Math.floor(Math.random()*pairs.length)]}
function say(who,text,x){const layer=document.getElementById('dl');layer.innerHTML='';const d=el('div','dialog');d.style.left=Math.max(12,Math.min(W-260,x-80))+'px';d.style.top='24%';d.innerHTML='<div class="who">'+who+'</div>'+text;layer.appendChild(d);S.dialogUntil=performance.now()+3200}
function npcAI(dt){for(const n of N){let base=n.id==='shipper'?38:30;n.x+=n.speed*n.dir*dt;if(n.x<90){n.x=90;n.dir=1}if(n.x>W-90){n.x=W-90;n.dir=-1}const ahead=N.filter(o=>o!==n&&o.lane===n.lane&&Math.sign(o.x-n.x)===n.dir).sort((a,b)=>Math.abs(a.x-n.x)-Math.abs(b.x-n.x))[0];let blocked=ahead&&Math.abs(ahead.x-n.x)<88;let playerBlocked=n.lane===S.lane&&Math.sign(S.x-n.x)===n.dir&&Math.abs(S.x-n.x)<78;let speed=base;if(blocked||playerBlocked){speed=10;if(blocked&&Math.abs(ahead.x-n.x)<54){const other=n.lane==='upper'?'lower':'upper';const occupied=N.some(o=>o!==n&&o.lane===other&&Math.abs(o.x-n.x)<75);if(!occupied)n.lane=other}}n.speed=speed;const e=document.getElementById('n-'+n.id),tag=document.getElementById('tag-'+n.id);e.style.left=(n.x-35)+'px';e.style.top=(n.lane==='upper'?51:55)+'%';e.style.transform=n.dir<0?'scaleX(-1)':'scaleX(1)';e.classList.toggle('walk',speed>12);tag.style.left=n.x+'px';tag.style.top=(n.lane==='upper'?46:51)+'%';if(Math.abs(n.x-S.x)<70&&performance.now()>S.dialogUntil&&(performance.now()-(S.lastNpc[n.id]||0)>9000)){say(n.name,line(n),n.x);S.lastNpc[n.id]=performance.now()}}
// NPC-to-NPC ambient conversation
for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){if(Math.abs(N[i].x-N[j].x)<60&&N[i].lane===N[j].lane&&performance.now()>S.dialogUntil&&performance.now()-S.lastPair>12000){say(N[i].name+' + '+N[j].name,pairDialogue(N[i],N[j]),(N[i].x+N[j].x)/2);S.lastPair=performance.now()}}}
function playerAI(dt){if(S.mode==='walk'){const d=S.target-S.x;if(Math.abs(d)>1)S.x+=Math.sign(d)*76*dt;else S.mode='idle'}const p=document.getElementById('player');p.style.left=(S.x-38)+'px';p.style.top='49%';p.classList.toggle('walk',S.mode==='walk')}
function events(){const near=EVENTS.findIndex(e=>Math.abs(e.x-S.x)<65);if(near>=0&&performance.now()>S.dialogUntil&&performance.now()>S.eventUntil){say('ĐỜI PHỐ',EVENTS[near].t,EVENTS[near].x);S.eventUntil=performance.now()+9000;S.lastEvent=near}}
function camera(){const vp=document.getElementById('vp'),w=document.getElementById('world');const max=Math.max(0,W-vp.clientWidth);S.cam=Math.max(0,Math.min(max,S.x-vp.clientWidth*.45));w.style.transform='translateX('+(-S.cam)+'px)';document.getElementById('meter').style.width=Math.round(S.x/W*100)+'%';let p=S.x<350?'Nhà trọ':S.x<620?'Cafe':S.x<940?'Phở':S.x<1220?'Tạp hóa':S.x<1500?'Hiệu thuốc':S.x<1800?'Điện thoại':S.x<2100?'Trạm xe':'Khu chợ';document.getElementById('place').textContent=p;POI.forEach(([n,x])=>{const q=document.getElementById('poi-'+x);if(q)q.classList.toggle('show',Math.abs(S.x-x)<100)})}
function frame(ts){if(!S.last)S.last=ts;const dt=Math.min(.05,(ts-S.last)/1000);S.last=ts;playerAI(dt);npcAI(dt);events();camera();if(performance.now()>S.dialogUntil)document.getElementById('dl').innerHTML='';requestAnimationFrame(frame)}
build();requestAnimationFrame(frame);
})();
</script></body></html>
