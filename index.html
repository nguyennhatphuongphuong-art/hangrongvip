<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ĐỜI NÀY CÓ GÌ VUI? — Module 03 Complete Scene</title>
<style>
:root{--bg:#07121a;--panel:#0b1d29;--line:#41657d;--text:#f5f7f8;--muted:#a5b7c3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,430px);height:100dvh;background:var(--bg);overflow:hidden}
.hud{position:absolute;left:0;right:0;top:0;height:82px;padding:9px 12px;background:#07131bf2;border-bottom:1px solid var(--line);z-index:50}
.title{font-size:21px;font-weight:950;letter-spacing:-.7px}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.badge{position:absolute;right:11px;top:12px;font-size:8px;color:#7f9aaa}
.worldWrap{position:absolute;left:8px;right:8px;top:90px;bottom:132px;border:2px solid var(--line);border-radius:15px;overflow:hidden;background:#182a31;box-shadow:0 12px 30px #0008}
.world{position:absolute;left:0;top:0;height:100%;width:1180px;transform:translateX(0);will-change:transform}
.map{position:absolute;left:0;top:0;width:1180px;height:100%;object-fit:cover;image-rendering:pixelated}
.entity{position:absolute;width:auto;image-rendering:pixelated;z-index:10;filter:drop-shadow(0 4px 2px #0008);will-change:left,bottom,transform}
.player{height:31%;bottom:10%}.npc{height:27%;bottom:10%}
.vehicle{position:absolute;z-index:6;bottom:8%;font-size:30px;filter:drop-shadow(0 3px 2px #0008)}
.name{position:absolute;z-index:20;transform:translateX(-50%);background:#07141de8;border:1px solid #5a778a;border-radius:7px;padding:3px 5px;font-size:7px;white-space:nowrap}
.bubble{position:absolute;z-index:30;max-width:230px;background:#07141df2;border:1px solid #6a8798;border-radius:10px;padding:7px 9px;font-size:10px;line-height:1.25;box-shadow:0 7px 18px #0009}
.bubble:after{content:"";position:absolute;bottom:-5px;left:22px;width:9px;height:9px;background:#07141d;border-right:1px solid #6a8798;border-bottom:1px solid #6a8798;transform:rotate(45deg)}
.choicePanel{position:absolute;left:10px;right:10px;bottom:72px;background:#081720f5;border:1px solid var(--line);border-radius:12px;padding:8px;z-index:60}
.choiceTitle{font-size:9px;font-weight:950;margin-bottom:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{border:1px solid #466a81;border-radius:8px;background:#122b3e;color:#fff;padding:9px 7px;font-size:8px;font-weight:950}
button:active{transform:scale(.98)}button:disabled{opacity:.4}
.status{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);margin-top:6px}
.progress{height:5px;background:#21394a;border-radius:5px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;width:0;background:#78b8e8}
.bottom{position:absolute;left:8px;right:8px;bottom:8px;height:54px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;z-index:70}
.bottom button{background:#0e2434}
.toast{position:absolute;z-index:100;left:50%;top:93px;transform:translateX(-50%);background:#f5f7f8;color:#10202a;border-radius:8px;padding:7px 10px;font-size:9px;font-weight:950;box-shadow:0 7px 22px #0009;white-space:nowrap}
.event{position:absolute;z-index:35;bottom:29%;left:0;transform:translateX(-50%);background:#081720e8;border:1px solid #52758b;border-radius:8px;padding:5px 7px;font-size:8px;white-space:nowrap}
.pulse{animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.walk{animation:walk .28s infinite alternate}@keyframes walk{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.fade{animation:fade .18s}@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>

  {id:"khoa",name:"Khoa",x:610,speed:9,dir:-1,asset:"char_khoa.png",line:"Đường hôm nay đông ghê."},
  {id:"nga",name:"Nga",x:870,speed:11,dir:1,asset:"char_nga.png",line:"Chiều nay có đi ăn không?"},
  {id:"viet",name:"Việt",x:1030,speed:8,dir:-1,asset:"char_viet.png",line:"Mai nhớ đi học nhé."}
];

const events = [
  {x:250,text:"Một cô bán hàng đang gọi khách."},
  {x:430,text:"Hai người đứng bên đường nói chuyện."},
  {x:650,text:"Một chiếc xe chạy ngang qua."},
  {x:810,text:"Có người đang vội đi làm."},
  {x:1010,text:"Quán cà phê bắt đầu đông."}
];

function img(asset, cls, id) {
  const el = document.createElement("img");
  el.src = A[asset] || "";
  el.className = cls || "";
  if (id) el.id = id;
  el.draggable = false;
  return el;
}

function makeWorld() {
  app.innerHTML = `
    <div class="hud">
      <div class="title">ĐỜI NÀY CÓ GÌ VUI?</div>
      <div class="sub">MODULE 03 · ĐƯỜNG PHỐ — COMPLETE WORLD SCENE</div>
      <div class="badge">WORLD TEST 1.0</div>
    </div>
    <div class="worldWrap" id="viewport">
      <div class="world" id="world">
        <img class="map" src="${A["map_duong_pho.png"]}">
        <div id="entities"></div>
        <div id="bubble" class="bubble" style="display:none"></div>
        <div id="eventText" class="event" style="display:none"></div>
      </div>
    </div>
    <div class="choicePanel">
      <div class="choiceTitle">RA ĐƯỜNG</div>
      <div class="choices">
        <button data-act="walk">ĐI DẠO</button>
        <button data-act="park">RA CÔNG VIÊN</button>
        <button data-act="cafe">QUÁN CAFE</button>
        <button data-act="market">ĐI CHỢ</button>
      </div>
      <div class="status">
        <span id="status">Đang đứng ở đầu phố.</span>
        <span id="distance">0%</span>
      </div>
      <div class="progress"><i id="travelBar"></i></div>
    </div>
    <div class="bottom">
      <button data-act="home">VỀ PHÒNG</button>
      <button data-act="walk">ĐI TIẾP</button>
      <button data-act="stop">DỪNG LẠI</button>
    </div>
  `;

  const entities = document.getElementById("entities");

  const player = img("char_player_male.png","entity player","player");
  entities.appendChild(player);

  npcData.forEach(n => {
    const el = img(n.asset,"entity npc","npc-"+n.id);
    entities.appendChild(el);
    const tag = document.createElement("div");
    tag.className = "name";
    tag.id = "tag-"+n.id;
    tag.textContent = n.name;
    entities.appendChild(tag);
  });

  events.forEach((e,i) => {
    const tag = document.createElement("div");
    tag.className = "event";
    tag.id = "evt-"+i;
    tag.textContent = "•";
    entities.appendChild(tag);
  });

  document.querySelectorAll("[data-act]").forEach(b => {
    b.addEventListener("click", () => activity(b.dataset.act));
  });
}

function activity(type) {
  if (type === "home") {
    showToast("Đây là scene Module 03 độc lập. Về phòng sẽ được nối ở bản tổng.");
    return;
  }
  if (type === "stop") {
    state.playerMode = "idle";
    state.playerTarget = state.playerX;
    state.selectedActivity = null;
    updateStatus("Đứng lại quan sát đường phố.");
    return;
  }

  state.selectedActivity = type;
  state.playerMode = "walk";
  if (type === "walk") {
    state.playerTarget = PLAYER_MAX;
    updateStatus("Đang đi bộ tới cuối phố...");
  } else if (type === "park") {
    state.playerTarget = 360;
    updateStatus("Đang đi về phía công viên...");
  } else if (type === "cafe") {
    state.playerTarget = 720;
    updateStatus("Đang đi về phía quán cafe...");
  } else if (type === "market") {
    state.playerTarget = 1030;
    updateStatus("Đang đi về phía khu chợ...");
  }
}

function updateStatus(text) {
  const el = document.getElementById("status");
  if (el) el.textContent = text;
}

function showToast(text) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  app.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function showDialogue(text, x) {
  const b = document.getElementById("bubble");
  if (!b) return;
  b.textContent = text;
  b.style.display = "block";
  b.style.left = x + "px";
  b.style.top = "18%";
  clearTimeout(showDialogue.timer);
  showDialogue.timer = setTimeout(() => b.style.display="none", 2300);
}

function updateNPCs(dt) {
  npcData.forEach(n => {
    n.x += n.speed * n.dir * dt;
    if (n.x < 80) { n.x=80; n.dir=1; }
    if (n.x > WORLD_W-80) { n.x=WORLD_W-80; n.dir=-1; }

    const el = document.getElementById("npc-"+n.id);
    const tag = document.getElementById("tag-"+n.id);
    if (el) {
      el.style.left = (n.x - 38) + "px";
      el.style.transform = n.dir < 0 ? "scaleX(-1)" : "scaleX(1)";
    }
    if (tag) {
      tag.style.left = n.x + "px";
      tag.style.bottom = "39%";
    }

    if (Math.abs(n.x-state.playerX) < 70 && Math.random() < 0.0025) {
      showDialogue(n.line, Math.max(80, Math.min(830, n.x/1180*1000)));
    }
  });
}

function updateEvents() {
  const near = events.findIndex(e => Math.abs(e.x-state.playerX) < 45);
  events.forEach((e,i) => {
    const el = document.getElementById("evt-"+i);
    if (!el) return;
    el.style.left = e.x+"px";
    el.style.bottom = "34%";
    el.style.display = i===near ? "block" : "none";
  });
  if (near >= 0 && state.eventIndex !== near) {
    state.eventIndex = near;
    showDialogue(events[near].text, Math.max(80, Math.min(830, events[near].x/1180*1000)));
  }
}

function updatePlayer(dt) {
  if (state.playerMode === "walk") {
    const d = state.playerTarget-state.playerX;
    if (Math.abs(d) > 1) {
      state.playerX += Math.sign(d)*80*dt;
    } else {
      state.playerX = state.playerTarget;
      state.playerMode = "idle";
      showToast("Đã tới điểm đến.");
      updateStatus("Đang quan sát khu vực.");
    }
  }
  const p = document.getElementById("player");
  if (p) {
    p.style.left = (state.playerX-45)+"px";
    p.classList.toggle("walk",state.playerMode==="walk");
  }
}

function updateCamera() {
  const viewport = document.getElementById("viewport");
  const world = document.getElementById("world");
  if (!viewport || !world) return;

  const viewportPx = viewport.clientWidth;
  const maxCamera = WORLD_W - viewportPx;
  const desired = state.playerX - viewportPx*0.48;
  state.camera = Math.max(0,Math.min(maxCamera,desired));
  world.style.transform = `translateX(${-state.camera}px)`;

  const pct = Math.round((state.playerX-PLAYER_MIN)/(PLAYER_MAX-PLAYER_MIN)*100);
  const bar = document.getElementById("travelBar");
  const dist = document.getElementById("distance");
  if (bar) bar.style.width = Math.max(0,Math.min(100,pct))+"%";
  if (dist) dist.textContent = pct+"%";
}

function frame(ts) {
  if (!state.lastFrame) state.lastFrame=ts;
  const dt = Math.min(.05,(ts-state.lastFrame)/1000);
  state.lastFrame=ts;

  updatePlayer(dt);
  updateNPCs(dt);
  updateEvents();
  updateCamera();

  requestAnimationFrame(frame);
}

makeWorld();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
